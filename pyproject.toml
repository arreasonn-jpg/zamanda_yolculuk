[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zamanda-yolculuk-zt005-2"
version = "0.7.6"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "matplotlib>=3.8", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
