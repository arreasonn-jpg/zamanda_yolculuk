[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zamanda-yolculuk-zt005-2"
version = "0.8.0"
description = "Spacetime-manipulation hypothesis testing: MQS EM, stress-energy, retarded linearized GR, and known-metric/geodesic/CTC benchmarks"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.11", "matplotlib>=3.8", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
